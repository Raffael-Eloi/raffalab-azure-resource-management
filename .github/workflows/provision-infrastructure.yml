name: Reusable terraform CI/CD provision
on:
  workflow_call: 
    inputs: 
      folder-path:
        description: "Provision folder path"
        required: true
        type: string
        
      environment:
        description: "Target environment"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  Validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Cache Terraform providers
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', inputs.folder-path)) }}
          restore-keys: |
            tf-providers-${{ runner.os }}-

      - name: Validate resources
        run: |
          cd ${{ inputs.folder-path }}
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
  
  Plan:
    needs: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Cache Terraform providers
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', inputs.folder-path)) }}
          restore-keys: |
            tf-providers-${{ runner.os }}-

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform plan
        run: |
          cd ${{ inputs.folder-path }}
          if [ -f "env/azurerm-config-${{ inputs.environment }}.tfbackend" ];
            then terraform init -backend-config="env/azurerm-config-${{ inputs.environment }}.tfbackend"
          else
            terraform init
          fi
          terraform plan -var-file="./env/${{ inputs.environment }}.tfvars" -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.folder-path }}-${{ inputs.environment }}-tfplan
          path: ${{ inputs.folder-path }}/tfplan

  Apply:
    needs: Plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Cache Terraform providers
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', inputs.folder-path)) }}
          restore-keys: |
            tf-providers-${{ runner.os }}-

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download plan artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.folder-path }}-${{ inputs.environment }}-tfplan
          path: ${{ inputs.folder-path }}

      - name: Terraform apply
        run: |
          cd ${{ inputs.folder-path }}
          if [ -f "env/azurerm-config-${{ inputs.environment }}.tfbackend" ];
            then terraform init -backend-config="env/azurerm-config-${{ inputs.environment }}.tfbackend"
          else
            terraform init
          fi
          terraform apply -auto-approve tfplan